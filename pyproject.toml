[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "accrete-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.50.0",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
