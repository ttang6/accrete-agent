        confidence: confirmed
        source: "阿里云百炼 qwen3.8-max 模型信息页（华北2 北京，调用原价）"
        notes: >
          中国内地站原价：输入 12 / 输出 36 / 缓存命中 1.5 元每百万 Token。
          思考/非思考同价；输出含 reasoning。Batch / Token Plan 活动不写入基价。

  deepseek-v4-flash:
