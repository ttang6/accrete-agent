disclaimer: >
  价格来自官方公告与第三方追踪站点。厂商迭代频繁，且存在阶梯计价、地区差异定价、
  促销价与永久价交替生效等情况，数值可能与最新官网有偏差。
  尤其 qwen3.5-flash 中国站输出价未找到权威二次确认来源。
  正式核算成本前请在阿里云百炼控制台与 DeepSeek 官方定价页二次核实。
