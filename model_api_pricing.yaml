# 模型 API 价格表。**仅供离线分析读取**，src/ 的运行时不认识任何模型价格。
#
# 调研时间 2026-08-04（qwen3.7 / qwen3.8-max 与 cn-only 整理 2026-08-10）。
# 数据来源：各模型官方定价页 / 百炼模型信息页，与第三方追踪站点交叉核对。
#
# 键就是配置里写的模型名，与 configs/*.yaml 的 model 字段逐字对应。
# qwen / deepseek 只保留中国内地（cn）原价；intl 不记。
# 其余模型若同时有 cn/intl，二者是厂商各自独立标价，**不是汇率换算关系**。
#
# 价格字段统一为三个，缺失记 null：
#   input_per_1m          未命中缓存的输入单价
#   cached_input_per_1m   命中缓存的输入单价
#   output_per_1m         输出单价（思考 token 已含在输出里，不另计价）
#
# confidence: confirmed 表示有官方或多方独立确认；estimated 表示按比例推断，报告须标注。

as_of: 2026-08-17

billing:
  # 端点主机 → 计价区域。据此从运行快照里的 provider.base_url 自动选价，
  # 避免换了 endpoint 而价格没跟着换。
  endpoint_region:
    dashscope.aliyuncs.com: cn
    dashscope-intl.aliyuncs.com: intl
    api.x.ai: intl
  # DeepSeek 两个区域共用 api.deepseek.com，主机判定不出来，须按账户显式指定。
  explicit_region_required:
    - api.deepseek.com
  default_region: cn

models:

  qwen3.5-flash:
    context_window_tokens: 1048576
    max_output_tokens: 65536
    prices:
      cn:
        currency: CNY
        input_per_1m: 0.2
        cached_input_per_1m: null
        output_per_1m: 0.8
        confidence: estimated
        source: "量子位报道（2026-02-25 阿里云百炼国内站官宣价）"
        notes: >
          官方新闻稿只明确「输入低至 0.2 元/百万 Token」，输出价未见权威二次确认，
          按输入约 4 倍推算。以控制台账单为准。

  qwen3.5-plus:
    context_window_tokens: 1048576
    prices:
      cn:
        currency: CNY
        input_per_1m: 0.8
        cached_input_per_1m: null
        output_per_1m: 4.8
        confidence: confirmed
        source: "阿小云 / 阿里云开发者社区（2026-03-28）"
        tiered: >
          128K 以内输入价；128K–256K 区间输入涨至 2 元/百万 Token。
          阶梯计价而非分段计费，整请求按命中档位结算。

