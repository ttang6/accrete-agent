        confidence: confirmed
        source: "aiapiprice.com（2026-06-15，阿里云百炼中国内地部署官方价）"
        tiered: "0–256K 输入区间价；更长输入进入更高阶梯"

  qwen3.6-plus:
    context_window_tokens: 1048576
    prices:
      cn:
        currency: CNY
        input_per_1m: 2.0
        cached_input_per_1m: 0.2
        output_per_1m: 12.0
        confidence: confirmed
        source: "阿里云开发者社区（2026-04-06 官方发布）"

  # 调研 2026-08-10。https://help.aliyun.com/zh/model-studio/qwen3-7-flash
  qwen3.7-flash:
    context_window_tokens: 1000000
    max_output_tokens: 131072
    prices:
