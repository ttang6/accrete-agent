id: mt_failretry_correction_chain
description: |
  多轮·失败重试：用户第一轮给错 ID（typo），中途纠正（self-correction 场景）。
  turn 1 错 ID 让 agent fetch 失败 / mark items 字段错值；turn 2 用户纠正；
  turn 3 给标题确认。grade 最后一轮。
  飞轮预期：turn 1 的 wrong-value error 跟 missing-value 不同 lesson；测飞轮是否能区分。
query:
  - "记一下 2510.27097 那篇 RAG 论文"
  - "搞错了，ID 是 2510.20797v1"
  - "标题是 Simple Context Compression"
expected_obligations:
  - mark_digest_when_user_asks_to_record
expected_tool_calls:
  - {tool: skill_exec, skill: ai-digest, script: dup_check}
expected_coverage: []
max_iterations: 25
success_keywords:
  - "已记录"
expected_failure_type: "turn 1 ID typo → arxiv 解析失败或 dup_check 找不到对应条目；turn 2 纠正后该正常 mark；测飞轮在'错值'类失败上是否能 helped"
