id: mt_long_failchain_schema_mismatch
description: '失败长链·连续 schema_mismatch：用户每轮都以不同程度的模糊方式描述要收藏的内容，连续多轮触发缺字段失败，最后一轮给全信息，飞轮应 helped。考察：多轮失败积累 + 飞轮在最终轮注入修复提示。'
query:
  - "帮我记一下今天看到的那篇讲 speculative decoding 的"
  - "就是 HF 上热度比较高的那篇，你应该知道的"
  - "名字里有 draft 那个词，好像是谷歌出的"
  - "arxiv 上的，大概是最近一个月内发的"
  - "行吧，id 是 2502.11157，标题是 Draft Model Knows When to Stop，帮我存上"
expected_obligations:
  - mark_digest_when_user_asks_to_record
expected_tool_calls:
  - {tool: skill_exec, skill: ai-digest, script: dup_check}
expected_coverage: []
max_iterations: 25
success_keywords:
  - "已记录"
expected_failure_type: "turn 1-4 每轮 dup_check 因缺 fp 触发 schema_mismatch，连续失败入 candidate lessons；turn 5 给完整 arxiv id 后飞轮 hint 应让 agent 直接用 fp=2502.11157 构造合规 args"
expected_pattern: drill_down

