id: mt_long_correct_redo_coverage_rebuild
description: '修正叠加·coverage 重建：用户先砍掉新闻只要 paper+oss，然后说新闻也要，然后又限定只要某个 RSS 来源的新闻，最后确认 coverage 满足后 mark。考察：coverage 约束动态增删 + 来源过滤 + 最终合规 mark。'
query:
  - "出个日报，paper 和 github 仓库各来几条"
  - "感觉少了点，加上新闻吧，各个来源都来一点"
  - "新闻太杂了，只要 MIT Technology Review 的就好"
  - "MIT 那边今天有几条，够不够，不够的话多拉一点"
  - "paper 那边能不能再多来两篇，感觉三篇不太够"
  - "好了，够了，github 的仓库和 paper 都帮我标记，新闻不用"
  - "等等，把刚才 MIT 那条关于 AI safety 的新闻也加进去一起标了"
expected_obligations:
  - mark_digest_when_user_asks_to_record
expected_tool_calls:
  - {tool: skill_exec, skill: ai-digest, script: dup_check}
expected_coverage: []
max_iterations: 25
success_keywords:
  - "已记录"
expected_failure_type: "turn 1-6 coverage 约束多次变更，turn 6 mark 排除新闻后 turn 7 又追加单条新闻；agent 若 turn 7 未补调 dup_check mark 则 obligation violation；飞轮应提示追加条目需补 mark 操作"
expected_pattern: correct_redo
