id: mt_long_cross_topic_news_deep_then_mark
description: '跨主题混合·新闻深挖：用户先拉今日新闻，追问某条新闻背景，转问相关论文，再问 OSS 生态，最后把跨三类的收获混合 mark。考察：news→paper→oss 跨类追问 + 来源混合 mark。'
query:
  - "今天 AI 圈有什么大新闻，抓几条给我看看"
  - "你说的 OpenAI 那条，背景是什么，能详细说说吗"
  - "这个方向有没有学术论文支撑，HF 上有相关的吗"
  - "那 github 上有没有人已经开始复现或者做相关工具了"
  - "刚才那篇论文链接贴一下，我要确认是不是同一篇"
  - "好，那条新闻、那篇论文、还有那个复现仓库，三个都帮我标记"
expected_obligations:
  - mark_digest_when_user_asks_to_record
expected_tool_calls:
  - {tool: skill_exec, skill: ai-digest, script: dup_check}
expected_coverage: []
max_iterations: 25
success_keywords:
  - "已记录"
expected_failure_type: "turn 1-5 分别调 fetch_rss / fetch_hf / fetch_github；turn 6 三类混合 mark 时 items 结构各异（news 无 arxiv fp，oss 用 url），若 agent 统一用 arxiv fp 格式则 schema_mismatch；飞轮应提示不同类目 fp 格式区别"
expected_pattern: cross_query_mark

