id: mt_long_drill_down_moe_then_mark
description: '长链追问·MoE 主题：用户从宽泛问 MoE 进展，每轮追问更深细节，第 5 轮顺口说"记一下"。考察：多轮上下文保持 + 深度追问 + 最后一轮 mark obligation。'
query:
  - "最近 MoE 方向有什么新进展，简单说说"
  - "你提到的那个 expert routing 优化，能展开讲讲吗，怎么降低 load imbalance 的"
  - "那 token dropping 策略具体是怎么决定哪些 token 不路由的？有没有论文里的实验数据"
  - "听起来跟 DeepSeek MoE 的思路有点像，他们是一回事吗还是不同方向"
  - "好的我懂了，这几篇都挺值得看的，帮我记一下"
expected_obligations:
  - mark_digest_when_user_asks_to_record
expected_tool_calls:
  - {tool: skill_exec, skill: ai-digest, script: dup_check}
expected_coverage: []
max_iterations: 25
success_keywords:
  - "已记录"
expected_failure_type: "前四轮 fetch_hf 正常；turn 5 mark 时若无合规 fp 触发 schema_mismatch；飞轮应在 turn 5 注入 fp=arxiv_id 修复提示"
expected_pattern: drill_down

---
id: mt_long_drill_down_agent_eval_then_mark
description: '长链追问·Agent Evaluation 主题：用户先问 agent eval 框架，连续追问 benchmark 设计、human annotation、自动评分等细节，第 7 轮说"这篇存一下"。考察：超长上下文保持 + 专题追问 + 最末轮 mark。'
query:
  - "现在评估 LLM agent 能力有哪些主流 benchmark，你知道哪些"
  - "AgentBench 和 WebArena 有什么区别，分别测什么"
  - "WebArena 的 task 是人工标注的还是自动生成的，标注成本怎么控制"
  - "那自动评分的话，怎么判断 agent 有没有真的完成任务，不是只看最后输出"
  - "有没有论文专门讲 process reward 在 agent eval 里的应用的"
  - "你提到那篇 process-level 评估的，是哪篇，arxiv 有吗"
  - "好，帮我把这篇收藏一下"
expected_obligations:
  - mark_digest_when_user_asks_to_record
expected_tool_calls:
  - {tool: skill_exec, skill: ai-digest, script: dup_check}
expected_coverage: []
max_iterations: 25
success_keywords:
  - "已记录"
expected_failure_type: "turn 1-6 fetch_hf 上下文积累；turn 7 mark 时 fp 需从对话中解析 arxiv id，若 agent 用标题替代 fp 触发 schema_mismatch；飞轮应提示 fp 必须是 arxiv id"
expected_pattern: drill_down

