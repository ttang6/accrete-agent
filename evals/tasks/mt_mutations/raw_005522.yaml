expected_coverage: []
max_iterations: 25
success_keywords:
  - "已记录"
expected_failure_type: "turn 3 agent 可能用 turn 1（今天）的上下文做 reference resolution 而非 turn 2（昨天）；飞轮应教 agent 在时间窗口改变后清除前轮缓存 context"
