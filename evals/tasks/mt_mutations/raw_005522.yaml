id: mt_coverage_gap_progressive_add
description: |
  多轮·累加 coverage：turn 1 用户只要论文（≥3），出完之后 turn 2 说"再加几个 github 仓库"，
  turn 3 说"最后加条新闻"。测 agent 是否累加而非重置 coverage 计数。
  grade 最后一轮——累计 paper≥3 + oss≥2 + news≥1 才满足 coverage。
query:
  - "给我今天的 AI 论文日报，要三篇以上"
  - "挺好的，再补几个相关的 github 仓库吧，两个以上"
  - "差点忘了，再加一条今天的行业新闻"
expected_obligations: []
expected_tool_calls:
  - {tool: skill_exec, skill: ai-digest, script: fetch_hf}
  - {tool: skill_exec, skill: ai-digest, script: fetch_github}
  - {tool: skill_exec, skill: ai-digest, script: fetch_rss}
expected_coverage:
  - {type: paper, min: 3}
  - {type: oss, min: 2}
  - {type: news, min: 1}
max_iterations: 25
success_keywords:
  - "仓库"
  - "新闻"
expected_failure_type: "turn 2/3 agent 若重置累计 coverage 则 grader retry；测飞轮能否在 coverage_gap 失败后给出'保留前轮已 fetch 内容'的 repair hint"
expected_pattern: coverage_gap_progressive

