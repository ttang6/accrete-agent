  多轮·跨轮收藏：turn 1 出日报含多条新闻，turn 2 让 agent 收藏新闻里某家来源的条目，
  turn 3 用户确认数量是否对。grade 最后一轮（确认时如发现漏 mark 需补调 dup_check）。
  考察：来源过滤 + 跨轮引用 + 数量核对。
query:
  - "来一份今天的日报，新闻多抓几条"
  - "把里面 The Verge 的那几条新闻标记一下"
  - "刚才标了几条？有没有漏的，再确认一次"
expected_obligations:
  - mark_digest_when_user_asks_to_record
expected_tool_calls:
  - {tool: skill_exec, skill: ai-digest, script: dup_check}
expected_coverage: []
max_iterations: 25
success_keywords:
  - "已记录"
expected_failure_type: "turn 2 来源过滤依赖 agent 对 turn 1 上下文解析；turn 3 确认时若 agent 已漏 mark 需再次调 dup_check 补全；飞轮应在 turn 3 注入 repair hint"
expected_pattern: cross_query_mark

