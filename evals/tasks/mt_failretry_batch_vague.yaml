id: mt_failretry_batch_vague
description: |
  多轮·失败重试：用户一次性给多条且全模糊（multi-item 场景）。
  turn 1 全条目缺 fp，dup_check items 数组校验失败；turn 2 用户批量补；
  turn 3 用户确认是否成功。grade 最后一轮。
  飞轮预期：repair_example 应包含 multi-item 完整 args 模板。
query:
  - "今天那两篇 RAG 论文和 microsoft/agent-framework 都收藏一下"
  - "ID 分别是 2510.20797v1 和 2604.10734，仓库 url 是 https://github.com/microsoft/agent-framework"
  - "都标好了吗？"
expected_obligations:
  - mark_digest_when_user_asks_to_record
expected_tool_calls:
  - {tool: skill_exec, skill: ai-digest, script: dup_check}
expected_coverage: []
max_iterations: 25
success_keywords:
  - "已记录"
expected_failure_type: "turn 1 multi-item 全缺 fp → schema_mismatch；飞轮 hint 该给 multi-item items=[{fp,title}, {fp,title}, ...] 完整模板"
