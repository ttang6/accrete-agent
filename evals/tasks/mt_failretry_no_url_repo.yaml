id: mt_failretry_no_url_repo
description: |
  多轮·失败重试：用户描述仓库但不给 URL（命令式 + 缺关键字段场景）。
  turn 1 agent 缺 url/fingerprint 触发 dup_check 失败；turn 2 用户补 url；
  turn 3 顺手再加一个仓库。grade 最后一轮。
  飞轮预期：跟缺 fp 论文同模式，repair_example 教 url 字段如何填。
query:
  - "记一下微软新出的 agent 框架仓库"
  - "url 是 https://github.com/microsoft/agent-framework"
  - "顺便标一下 langchain-ai/langgraph"
expected_obligations:
  - mark_digest_when_user_asks_to_record
expected_tool_calls:
  - {tool: skill_exec, skill: ai-digest, script: dup_check}
expected_coverage: []
max_iterations: 25
success_keywords:
  - "已记录"
expected_failure_type: "turn 1 仓库描述无 url → tool_runtime_error / schema_mismatch；飞轮该召回 fp=github_full_name 模式"
