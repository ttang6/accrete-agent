id: mt_failretry_paper_title_only
description: |
  多轮·失败重试：用户只给论文标题没给 ID（真实 TG 场景：用户记得标题但不记 ID）。
  turn 1 agent 大概率 dup_check 失败（标题不能当 fingerprint）；turn 2 用户补 ID；
  turn 3 用前面经验加新条目。grade 最后一轮。
  飞轮预期：turn 1 失败入 candidate lesson；evolved 下 turn 2/3 召回 [structured-repair-hint]。
query:
  - "记一下今天那篇 Simple Context Compression 论文，HF 上看到的"
  - "ID 是 2510.20797v1"
  - "再加 microsoft/agent-framework 这个仓库"
expected_obligations:
  - mark_digest_when_user_asks_to_record
expected_tool_calls:
  - {tool: skill_exec, skill: ai-digest, script: dup_check}
expected_coverage: []
max_iterations: 25
success_keywords:
  - "已记录"
expected_failure_type: "turn 1 标题非合法 fingerprint → schema_mismatch / tool_runtime_error；飞轮 hint 应教 fp 必须是 arxiv id / url 而非标题"
