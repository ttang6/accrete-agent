id: mt_failretry_vague_paper
description: |
  多轮·失败重试：用户第一轮模糊指代论文（缺 fingerprint），agent 大概率失败；
  第二轮用户补全 ID，第三轮用户用补全经验再加一个仓库。grade 最后一轮。
  飞轮预期：turn 1 失败入 candidate lesson；evolved mode 下 turn 2/3 召回提示。
query:
  - "记一下今天那篇讲 RAG 长上下文压缩的论文"
  - "id 是 2510.20797v1，标题大概叫 Simple Context Compression"
  - "再记一下 microsoft/agent-framework 这个仓库，今天看到的"
expected_obligations:
  - mark_digest_when_user_asks_to_record
expected_tool_calls:
  - {tool: skill_exec, skill: ai-digest, script: dup_check}
expected_coverage: []
max_iterations: 25
success_keywords:
  - "已记录"
expected_failure_type: "turn 1 missing fingerprint → tool_runtime_error；飞轮该在 turn 2/3 注入 [structured-repair-hint] 让 agent 直接构造合规 args"
