id: mt_failretry_implicit_today
description: |
  多轮·失败重试：用户假设 agent 知道"今天看过什么"（reference resolution 失败场景）。
  turn 1 agent 没"今天"上下文（新 session），fetch 一通后试 mark 仍可能缺 fp；
  turn 2 用户口头描述哪篇；turn 3 给 ID。grade 最后一轮。
  飞轮预期：turn 1/2 都可能失败入库；turn 3 召回 hint 修复。
query:
  - "把今天日报第二条收藏"
  - "就是讲 RAG 长上下文压缩那篇"
  - "ID 应该是 2510.20797v1，标题是 Simple Context Compression"
expected_obligations:
  - mark_digest_when_user_asks_to_record
expected_tool_calls:
  - {tool: skill_exec, skill: ai-digest, script: dup_check}
expected_coverage: []
max_iterations: 25
success_keywords:
  - "已记录"
expected_failure_type: "turn 1 没'今天日报'上下文 → reference resolution 失败 → agent 可能 fetch 后 mark 缺 fp；turn 3 飞轮 hint 应让 mark 直接 work"
