id: mt_drill_down_rag_then_mark
description: '多轮·追问加深：用户先宽泛问 RAG 最新进展，agent 给摘要；

  turn 2 追问其中某篇的方法细节；turn 3 觉得有用，顺口说"记一下"。

  考察：追问上下文保持 + 最后一轮 ObligationTracker 触发 mark。

  '
query:
- 最近 RAG 有什么新论文，给我讲讲
- 你说的那个 context compression 方法，能展开说说怎么做的吗
- 挺有意思的，记一下这篇
expected_obligations:
- mark_digest_when_user_asks_to_record
expected_tool_calls:
- tool: skill_exec
  skill: ai-digest
  script: dup_check
expected_coverage: []
max_iterations: 25
success_keywords:
- 已记录
