id: mt_conflict_today_vs_yesterday
description: '多轮·冲突：用户先要"今天的论文"，看到一半说"不对，我要看昨天的"，

  然后又说"其实今天昨天都给我吧，最后都标记上"。

  考察：时间窗口冲突 + 两次 fetch + 合并 mark。

  '
query:
- HF 今天有哪些新论文
- 不对我记错了，我想要昨天的，今天的先放一边
- 行吧，两天的都给我，都标记上
expected_obligations:
- mark_digest_when_user_asks_to_record
expected_tool_calls:
- tool: skill_exec
  skill: ai-digest
  script: dup_check
expected_coverage: []
max_iterations: 25
success_keywords:
- 已记录
