# RSS 订阅源配置
#
# 字段说明：
#   name:     显示名称
#   rss_url:  RSS/Atom feed 地址
#   category: 分类标签，用于 LLM 过滤和日报分区
#             可选值：AI Research / AI Engineering / Open Source / Industry News
#   priority: high / normal（high 的源优先 fetch 全文）
#
# 添加新源：直接在 sources 列表里追加一条，重启 Bot 生效。
#
# 部分源依赖 Olshansk/rss-feeds（GitHub Actions 每小时更新，330 stars，活跃维护）：
# https://github.com/Olshansk/rss-feeds
# 涉及：Anthropic 系列、OpenAI Research、Google AI、xAI、Ollama、The Batch

sources:
  # ── AI Research ──────────────────────────────────────────
  - name: "Lil'Log (Lilian Weng)"
    rss_url: "https://lilianweng.github.io/index.xml"
    category: "AI Research"
    priority: high

  - name: "Anthropic Research"
    rss_url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_research.xml"
